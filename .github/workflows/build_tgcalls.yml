name: Build Native tgcalls

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip ninja-build cmake gcc g++
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Fetch Google depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          
      - name: Fetch WebRTC for Android
        run: |
          mkdir webrtc_checkout
          cd webrtc_checkout
          fetch --nohooks webrtc_android
          gclient sync
          
      - name: Clone tgcalls
        run: |
          git clone https://github.com/TelegramMessenger/tgcalls.git official_tgcalls
          
      - name: Build WebRTC
        run: |
          cd webrtc_checkout/src
          gn gen out/Release --args='target_os="android" target_cpu="arm64" is_debug=false rtc_include_tests=false rtc_build_examples=false android_static_analysis="off" treat_warnings_as_errors=false use_goma=false'
          ninja -j 4 -C out/Release webrtc
          
      - name: Setup JNI Build
        run: |
          # Copy tgcalls into our JNI folder
          cp -r official_tgcalls example/android/app/src/main/cpp/tgcalls
          
          # Create a custom CMakeLists.txt for the JNI build that uses the WebRTC source tree
          cat << 'EOF' > example/android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.10.2)
          project("custom_tgcalls")

          # Include tgcalls source files
          file(GLOB_RECURSE TGCALLS_SRC "tgcalls/tgcalls/*.cpp" "tgcalls/tgcalls/*.c")

          # Create our custom shared library containing the JNI wrapper and tgcalls source
          add_library(
                  custom_tgcalls
                  SHARED
                  tgcalls_jni.cpp
                  ${TGCALLS_SRC}
          )

          # Find Android libraries
          find_library(log-lib log)
          find_library(android-lib android)

          # Include directories for WebRTC and tgcalls
          target_include_directories(custom_tgcalls PRIVATE
                  ${CMAKE_CURRENT_SOURCE_DIR}/tgcalls
                  ${CMAKE_CURRENT_SOURCE_DIR}/../../../../../../../webrtc_checkout/src
                  ${CMAKE_CURRENT_SOURCE_DIR}/../../../../../../../webrtc_checkout/src/third_party/abseil-cpp
          )

          # Link against WebRTC static library
          target_link_libraries(
                  custom_tgcalls
                  ${CMAKE_CURRENT_SOURCE_DIR}/../../../../../../../webrtc_checkout/src/out/Release/obj/libwebrtc.a
                  ${log-lib}
                  ${android-lib}
          )

          target_compile_features(custom_tgcalls PUBLIC cxx_std_17)
          EOF

      - name: Build tgcalls JNI using CMake
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd example/android/app/src/main/cpp
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 ..
          make -j$(nproc)
          
      - name: Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcalls-android-arm64
          path: |
            example/android/app/src/main/cpp/build/**/*.so
            webrtc_checkout/src/out/Release/obj/libwebrtc.a
