name: Build WebRTC and JNI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache WebRTC
      id: cache-webrtc
      uses: actions/cache@v4
      with:
        path: |
          webrtc_checkout
          out/Release
        key: ${{ runner.os }}-webrtc-${{ hashFiles('**/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-webrtc-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 curl wget unzip cmake ninja-build default-jdk

    - name: Setup Depot Tools
      if: steps.cache-webrtc.outputs.cache-hit != 'true'
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "${GITHUB_WORKSPACE}/depot_tools" >> $GITHUB_PATH

    - name: Sync WebRTC
      if: steps.cache-webrtc.outputs.cache-hit != 'true'
      run: |
        export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
        mkdir -p webrtc_checkout
        cd webrtc_checkout
        fetch --nohooks --no-history webrtc_android || true
        cd src
        gclient sync -D --no-history

    - name: Build WebRTC
      if: steps.cache-webrtc.outputs.cache-hit != 'true'
      run: |
        export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
        cd webrtc_checkout/src
        gn gen ../../out/Release --args='target_os="android" target_cpu="arm64" is_debug=false rtc_include_tests=false enable_build_server=false android_static_analysis="off"'
        autoninja -C ../../out/Release webrtc
        
        # Copy built WebRTC libraries to the project's expected structure
        mkdir -p ../../example/android/app/src/main/cpp/libs/webrtc/jni/arm64-v8a
        # In a real scenario, you'd copy the generated .so file from out/Release to libs/webrtc/jni
        # find ../../out/Release -name "libjingle_peerconnection_so.so" -exec cp {} ../../example/android/app/src/main/cpp/libs/webrtc/jni/arm64-v8a/ \;

    - name: Fetch Official Telegram JNI
      run: |
        mkdir -p example/android/app/src/main/cpp/tgcalls
        git clone --depth 1 https://github.com/DrKLO/Telegram.git
        cp -r Telegram/TMessagesProj/jni/voip/* example/android/app/src/main/cpp/tgcalls/
        rm -rf Telegram
        
        # Remove local dummy JNI
        rm -f example/android/app/src/main/cpp/tgcalls_jni.cpp

    - name: Dynamic JNI Signature Injection
      run: |
        cd example/android/app/src/main/cpp/tgcalls
        
        # Replace the VoIPController signature dynamically (underscore format)
        find . -type f -name "*.cpp" -exec sed -i 's/org_telegram_messenger_voip_VoIPController/com_newchat_nchat_VoIPController/g' {} +
        find . -type f -name "*.cpp" -exec sed -i 's/org_telegram_messenger_voip_Instance/com_newchat_nchat_VoIPController/g' {} +
        
        # Replace the VoIPController signature dynamically (slash format for FindClass)
        find . -type f -name "*.cpp" -exec sed -i 's/org\/telegram\/messenger\/voip\/VoIPController/com\/newchat\/nchat\/VoIPController/g' {} +
        find . -type f -name "*.cpp" -exec sed -i 's/org\/telegram\/messenger\/voip\/Instance/com\/newchat\/nchat\/VoIPController/g' {} +
        
        # Strip/replace Telegram's custom FileLog dependencies with standard Android logging
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/FileLog::d/LOGI/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/FileLog::e/LOGE/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/FileLog::w/LOGI/g' {} +
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/#include "FileLog.h"//g' {} +

    - name: Update CMakeLists.txt
      run: |
        cat << 'EOF' > example/android/app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.10.2)
        
        project("custom_tgcalls")
        
        # Define LOGI and LOGE for Android logging since we stripped FileLog
        add_compile_definitions(LOGI(...)="__android_log_print(ANDROID_LOG_INFO, \"CustomTgCallsJNI\", __VA_ARGS__)")
        add_compile_definitions(LOGE(...)="__android_log_print(ANDROID_LOG_ERROR, \"CustomTgCallsJNI\", __VA_ARGS__)")
        
        # Set directory for WebRTC libs
        set(WEBRTC_LIB_DIR ${CMAKE_CURRENT_SOURCE_DIR}/libs/webrtc/jni/${ANDROID_ABI})
        
        add_library(webrtc SHARED IMPORTED)
        set_target_properties(webrtc PROPERTIES IMPORTED_LOCATION ${WEBRTC_LIB_DIR}/libjingle_peerconnection_so.so)
        
        # Include official fetched tgcalls wrapper files
        file(GLOB_RECURSE TGCALLS_SRC "tgcalls/*.cpp" "tgcalls/*.c")
        
        # Create our custom shared library without the local dummy file
        add_library(
                custom_tgcalls
                SHARED
                ${TGCALLS_SRC}
        )
        
        find_library(log-lib log)
        find_library(android-lib android)
        
        target_include_directories(custom_tgcalls PRIVATE
                ${CMAKE_CURRENT_SOURCE_DIR}/tgcalls
                ${CMAKE_CURRENT_SOURCE_DIR}/include
        )
        
        target_link_libraries(
                custom_tgcalls
                webrtc
                ${log-lib}
                ${android-lib}
        )
        
        target_compile_features(custom_tgcalls PUBLIC cxx_std_17)
        EOF

    - name: Compile JNI via Gradle
      run: |
        cd example/android
        chmod +x ./gradlew
        ./gradlew assembleDebug
        
    - name: Extract and Collect .so files
      run: |
        mkdir -p telegram_tgcalls_so_files
        # Find all generated libcustom_tgcalls.so files and copy them to our artifact folder, preserving ABI structure
        find example/android/app/build -name "libcustom_tgcalls.so" -exec bash -c '
          for file; do
            abi=$(basename "$(dirname "$file")")
            mkdir -p "telegram_tgcalls_so_files/$abi"
            cp "$file" "telegram_tgcalls_so_files/$abi/"
          done
        ' _ {} +

    - name: Upload .so Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Official-Telegram-JNI-Libraries
        path: telegram_tgcalls_so_files/
        retention-days: 7
