name: tdlib_example
description: NCHAT - A high-performance Telegram client built with TDLib.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  tdlib: ^1.6.0

  # State Management
  flutter_riverpod: any
  riverpod_annotation: any

  # Navigation
  go_router: any

  # Storage & Files
  path_provider: any
  path: any
  shared_preferences: any

  # Audio — PTT & Voice Notes
  record: any
  just_audio: any
  audio_session: any

  # Background Service (Walkie-Talkie)
  flutter_background_service: any
  flutter_local_notifications: any

  # Files & Media
  file_picker: any
  image_picker: any
  cached_network_image: any
  photo_view: any
  open_filex: any

  # Utilities
  uuid: any
  intl: any
  shimmer: any
  collection: any
  equatable: any

  # UI
  flutter_svg: any
  google_fonts: any

  cupertino_icons: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  riverpod_generator: any
  build_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
